name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install project dependencies
        run: poetry install --with dev

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Install PyYAML (the parity tests read the YAML example)
        run: poetry run python -m pip install pyyaml

      - name: Run tests
        run: poetry run python -m unittest discover -s tests/skills/structured-flow -v

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/structured-flow/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: src/structured-flow/ui

      - name: Typecheck the UI
        run: npx tsc --noEmit
        working-directory: src/structured-flow/ui

      - name: Run UI tests
        run: npm test
        working-directory: src/structured-flow/ui

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Check files written by the UI with the Python implementation
        run: |
          python tests/skills/structured-flow/check_roundtrip.py src/structured-flow/ui/.roundtrip
          for f in src/structured-flow/ui/.roundtrip/*.json src/structured-flow/ui/.roundtrip/*.yaml; do
            case "$f" in *.expected.json) continue ;; esac
            python skills/structured-flow/scripts/validate.py -p "$f"
          done

      - name: Build the viewer
        run: npm run build
        working-directory: src/structured-flow/ui

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
        working-directory: src/structured-flow/ui

      - name: Run browser smoke tests
        run: npm run e2e
        working-directory: src/structured-flow/ui

      - name: Check the committed viewer is up to date
        run: git diff --exit-code skills/structured-flow/assets/flow-ui.html
