<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · durable-flow</title>
<script>
  // Resolve the theme before the first paint: "light", "dark", or "auto"
  // (follow the system). The choice is remembered per browser when possible.
  (() => {
    const media = matchMedia("(prefers-color-scheme: dark)");
    let mode = "auto";
    try { mode = localStorage.getItem("durable-flow-theme") || "auto"; } catch {}
    const apply = () => {
      document.documentElement.dataset.theme =
        mode === "auto" ? (media.matches ? "dark" : "light") : mode;
      document.documentElement.dataset.themeMode = mode;
    };
    media.addEventListener("change", apply);
    window.setThemeMode = next => {
      mode = next;
      try { localStorage.setItem("durable-flow-theme", next); } catch {}
      apply();
    };
    apply();
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f8;
    --surface: #ffffff;
    --surface-2: #f1f1f3;
    --switch-active: #ffffff;
    --border: #e4e4e8;
    --text: #18181b;
    --muted: #71717a;
    --edge: #c4c4cc;
    --focus: #4f46e5;
    --pending: #a1a1aa;
    --inprogress: #2563eb;
    --waiting: #d97706;
    --finished: #16a34a;
    --failed: #dc2626;
    --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .04);
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0e11;
    --surface: #17171b;
    --surface-2: #1f1f24;
    --switch-active: #34343c;
    --border: #2a2a31;
    --text: #ececf1;
    --muted: #8b8b96;
    --edge: #3f3f48;
    --focus: #818cf8;
    --pending: #71717a;
    --inprogress: #60a5fa;
    --waiting: #fbbf24;
    --finished: #4ade80;
    --failed: #f87171;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: minmax(0, 1fr);
  }

  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .theme-switch {
    margin-left: auto; align-self: center; display: inline-flex; gap: 2px; padding: 2px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2);
  }
  .theme-switch button {
    display: grid; place-items: center; width: 28px; height: 24px; padding: 0;
    border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer;
  }
  .theme-switch button:hover { color: var(--text); }
  .theme-switch button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .theme-switch svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  :root[data-theme-mode="auto"] .theme-switch [data-mode="auto"],
  :root[data-theme-mode="light"] .theme-switch [data-mode="light"],
  :root[data-theme-mode="dark"] .theme-switch [data-mode="dark"] {
    background: var(--switch-active); color: var(--text); box-shadow: var(--shadow);
  }
  .goal { margin: 8px 0 14px; max-width: 900px; white-space: pre-wrap; }
  .goal-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); margin-right: 6px;
  }
  .progress {
    display: flex; height: 6px; border-radius: 99px; overflow: hidden;
    background: var(--surface-2); max-width: 900px;
  }
  .progress span { transition: flex-grow .3s; }
  .legend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend b { color: var(--text); font-weight: 600; margin-left: 2px; }

  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .s-pending { --c: var(--pending); }
  .s-inprogress { --c: var(--inprogress); }
  .s-waiting { --c: var(--waiting); }
  .s-finished { --c: var(--finished); }
  .s-failed { --c: var(--failed); }
  .dot, .progress span { background: var(--c); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
  #graph-wrap { overflow: auto; position: relative; min-height: 0; }
  #graph { position: relative; margin: 0 auto; }
  #edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  #edges path {
    fill: none; stroke: var(--edge); stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round;
    transition: stroke .2s, opacity .2s;
  }
  #edges path.done { stroke: color-mix(in srgb, var(--finished) 55%, var(--edge)); }
  #edges path.hl { stroke: var(--focus); stroke-width: 2; }
  .dim #edges path:not(.hl) { opacity: .35; }

  .node {
    position: absolute;
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    color: inherit; font: inherit; text-align: left;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
    overflow: hidden;
  }
  /* Stages that need attention get a border tinted with their status. */
  .node.s-inprogress, .node.s-waiting, .node.s-failed {
    border-color: color-mix(in srgb, var(--c) 45%, var(--border));
  }
  .node:hover { border-color: var(--muted); transform: translateY(-1px); }
  .node:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .node.selected { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent), var(--shadow); }
  .dim .node:not(.selected):not(.related) > * { opacity: .4; }
  .node > * { transition: opacity .2s; }
  .node-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .order { font: 600 11px var(--mono); color: var(--muted); }
  .node-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-state { font-size: 12px; color: var(--muted); display: flex; align-items: center; }
  .node.s-inprogress .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); } }

  aside {
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow: auto;
    padding: 20px 24px 32px;
    min-height: 0;
  }
  .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  .d-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .d-head h2 { font-size: 16px; margin: 2px 0 0; word-break: break-word; }
  .pill {
    flex: none; display: inline-flex; align-items: center;
    padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 500;
    color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent);
  }
  .pill .dot { margin-right: 6px; }
  section { margin-top: 20px; }
  h3 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 8px;
  }
  .callout {
    margin-top: 16px; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap;
    background: color-mix(in srgb, var(--c) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: inherit; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip:hover { border-color: var(--muted); }
  .none { color: var(--muted); font-size: 13px; }
  pre {
    margin: 0; padding: 12px; border-radius: 8px; background: var(--surface-2);
    font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word;
    max-height: 420px; overflow: auto;
  }
  .text { white-space: pre-wrap; word-break: break-word; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 6px; }

  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; }
    #graph-wrap { max-height: 60vh; }
    #graph { margin: 0; }
    aside { border-left: 0; border-top: 1px solid var(--border); padding: 16px; }
    header { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1 id="flow-name"></h1>
    <span class="meta" id="flow-meta"></span>
    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-mode="auto" title="System theme" aria-label="System theme">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button type="button" data-mode="light" title="Light theme" aria-label="Light theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-mode="dark" title="Dark theme" aria-label="Dark theme">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
  </div>
  <p class="goal"><span class="goal-label">Goal</span><span id="flow-goal"></span></p>
  <div class="progress" id="progress"></div>
  <div class="legend" id="legend"></div>
</header>
<main>
  <div id="graph-wrap">
    <div id="graph">
      <svg id="edges"></svg>
    </div>
  </div>
  <aside id="details"><p class="empty">Select a stage to see its details.</p></aside>
</main>

<script type="application/json" id="flow-data">__FLOW_DATA__</script>
<script>
(() => {
  const flow = JSON.parse(document.getElementById("flow-data").textContent);
  const STATES = ["finished", "inprogress", "waiting", "pending", "failed"];
  const LABELS = { pending: "Pending", inprogress: "In progress", waiting: "Waiting", finished: "Finished", failed: "Failed" };
  const NODE_W = 196, NODE_H = 64, GAP_X = 20, GAP_Y = 44, PAD = 32;

  const stages = flow.stages.map((s, i) => ({ ...s, index: i, dependents: [] }));
  const byName = new Map(stages.map(s => [s.name, s]));
  stages.forEach(s => s.depends_on.forEach(d => byName.get(d).dependents.push(s.name)));

  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children.flat()) if (c != null) node.append(c);
    return node;
  };
  const dot = state => el("span", { class: `dot s-${state}` });
  const order = s => String(s.index + 1).padStart(2, "0");

  // Header
  document.querySelectorAll(".theme-switch button").forEach(button =>
    button.addEventListener("click", () => setThemeMode(button.dataset.mode)));
  document.getElementById("flow-name").textContent = flow.name;
  document.getElementById("flow-meta").textContent = `rev ${flow.revision} · ${flow.source}`;
  document.getElementById("flow-goal").textContent = flow.goal;
  const counts = Object.fromEntries(STATES.map(st => [st, stages.filter(s => s.state === st).length]));
  const progress = document.getElementById("progress");
  const legend = document.getElementById("legend");
  for (const st of STATES) {
    if (!counts[st]) continue;
    progress.append(el("span", { class: `s-${st}`, style: `flex-grow:${counts[st]}`, title: `${LABELS[st]}: ${counts[st]}` }));
    legend.append(el("span", {}, dot(st), LABELS[st], el("b", {}, String(counts[st]))));
  }
  legend.append(el("span", {}, `${counts.finished} / ${stages.length} done`));

  // Layout: a stage's row is the longest dependency path leading to it. An
  // edge that spans several rows gets a narrow waypoint in every row it
  // crosses, so it runs beside the stages in between instead of behind them.
  // Within a row, stages and waypoints are ordered by the mean position of
  // their predecessors to reduce edge crossings; ties keep the execution
  // order, with waypoints after stages.
  const WAYPOINT_W = 16;
  stages.forEach(s => { s.layer = Math.max(-1, ...s.depends_on.map(d => byName.get(d).layer)) + 1; });
  const rows = [];
  stages.forEach(s => {
    Object.assign(s, { w: NODE_W, preds: [] });
    (rows[s.layer] ??= []).push(s);
  });
  const edges = stages.flatMap(s => s.depends_on.map(d => {
    const hops = [byName.get(d)];
    for (let layer = hops[0].layer + 1; layer < s.layer; layer++) {
      const waypoint = { waypoint: true, index: s.index, w: WAYPOINT_W, preds: [hops.at(-1)] };
      rows[layer].push(waypoint);
      hops.push(waypoint);
    }
    s.preds.push(hops.at(-1));
    hops.push(s);
    return { from: d, to: s.name, hops };
  }));

  const cx = n => n.x + n.w / 2;
  const center = n => n.preds.length
    ? n.preds.reduce((sum, p) => sum + cx(p), 0) / n.preds.length
    : n.index;
  const rowWidth = row => row.reduce((sum, n) => sum + n.w, 0) + (row.length - 1) * GAP_X;
  const graphWidth = Math.max(...rows.map(rowWidth));
  rows.forEach((row, y) => {
    row.sort((a, b) =>
      center(a) - center(b) || Number(!!a.waypoint) - Number(!!b.waypoint) || a.index - b.index);
    let x = PAD + (graphWidth - rowWidth(row)) / 2;
    for (const n of row) {
      n.x = x;
      n.y = PAD + y * (NODE_H + GAP_Y);
      x += n.w + GAP_X;
    }
  });

  const graph = document.getElementById("graph");
  const svg = document.getElementById("edges");
  const width = PAD * 2 + graphWidth;
  const height = PAD * 2 + rows.length * NODE_H + (rows.length - 1) * GAP_Y;
  graph.style.width = `${width}px`;
  graph.style.height = `${height}px`;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);

  // Spread several edges along a stage's edge, in the order of their
  // neighbouring hops so that they do not cross.
  const spread = (list, neighbour, assign) => {
    list.sort((a, b) => cx(neighbour(a)) - cx(neighbour(b)));
    list.forEach((e, i) => assign(e, (i - (list.length - 1) / 2) * 18));
  };
  for (const s of stages) {
    spread(edges.filter(e => e.hops[0] === s), e => e.hops[1], (e, dx) => { e.x1 = cx(s) + dx; });
    spread(edges.filter(e => e.hops.at(-1) === s), e => e.hops.at(-2), (e, dx) => { e.x2 = cx(s) + dx; });
  }

  // Each hop between rows is a curve with straight stubs at both ends, so a
  // downward chevron drawn with the same stroke lines up with the edge and
  // shares its colour. Through a waypoint the edge runs straight down.
  const hop = (x1, y1, x2, y2) => {
    const stub = 10, top = y1 + stub, bottom = y2 - stub;
    const dy = Math.max(16, (bottom - top) / 2);
    return ` L${x1},${top} C${x1},${top + dy} ${x2},${bottom - dy} ${x2},${bottom} L${x2},${y2}`;
  };
  for (const e of edges) {
    const src = e.hops[0], dst = e.hops.at(-1);
    let x = e.x1, y = src.y + NODE_H, d = `M${x},${y}`;
    for (const waypoint of e.hops.slice(1, -1)) {
      d += hop(x, y, cx(waypoint), waypoint.y);
      x = cx(waypoint);
      y = waypoint.y + NODE_H;
      d += ` L${x},${y}`;
    }
    const x2 = e.x2, y2 = dst.y - 3;
    d += hop(x, y, x2, y2) + ` M${x2 - 4},${y2 - 5} L${x2},${y2} L${x2 + 4},${y2 - 5}`;
    e.path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    e.path.setAttribute("d", d);
    if (src.state === "finished") e.path.classList.add("done");
    svg.append(e.path);
  }

  for (const s of stages) {
    s.node = el("button", {
      class: `node s-${s.state}`,
      style: `left:${s.x}px;top:${s.y}px;width:${NODE_W}px;height:${NODE_H}px`,
      title: s.name,
      onclick: () => select(s.name),
    },
      el("div", { class: "node-top" }, el("span", { class: "order" }, order(s)), el("span", { class: "node-name" }, s.name)),
      el("div", { class: "node-state" }, dot(s.state), LABELS[s.state]),
    );
    graph.append(s.node);
  }

  // Details
  const details = document.getElementById("details");
  const chip = name => {
    const s = byName.get(name);
    return el("button", { class: "chip", onclick: () => select(name) }, dot(s.state), name);
  };
  const block = (title, ...content) => el("section", {}, el("h3", {}, title), ...content);
  const value = v => {
    if (v === null || v === undefined) return el("p", { class: "none" }, "No output yet.");
    if (typeof v === "string") return el("pre", { class: "text" }, v);
    return el("pre", {}, JSON.stringify(v, null, 2));
  };

  function renderDetails(s) {
    const deps = s.depends_on;
    const ready = deps.every(d => byName.get(d).state === "finished");
    details.replaceChildren(...[
      el("div", { class: "d-head" },
        el("div", {}, el("span", { class: "order" }, `STAGE ${order(s)} / ${stages.length}`), el("h2", {}, s.name)),
        el("span", { class: `pill s-${s.state}` }, dot(s.state), LABELS[s.state]),
      ),
      s.message ? el("div", { class: `callout s-${s.state}` }, s.message) : null,
      block("Depends on", deps.length ? el("div", { class: "chips" }, deps.map(chip)) : el("p", { class: "none" }, "No dependencies.")),
      block("Required by", s.dependents.length ? el("div", { class: "chips" }, s.dependents.map(chip)) : el("p", { class: "none" }, "No dependent stages.")),
      block("Prompt", el("pre", { class: "text" }, s.prompt)),
      deps.length && ready
        ? block("Input", el("details", {}, el("summary", {}, "Outputs of dependencies"),
            value(Object.fromEntries(deps.map(d => [d, byName.get(d).output])))))
        : null,
      block(`Output${s.output_schema ? ` · ${s.output_schema}` : " · str"}`,
        value(s.output),
        s.output_schema
          ? el("details", {}, el("summary", {}, "Schema"), value(flow.schemas[s.output_schema]))
          : null,
      ),
    ].filter(Boolean));
    details.scrollTop = 0;
  }

  function select(name) {
    const s = byName.get(name);
    if (!s) return;
    graph.classList.add("dim");
    const related = new Set([...s.depends_on, ...s.dependents]);
    for (const st of stages) {
      st.node.classList.toggle("selected", st === s);
      st.node.classList.toggle("related", related.has(st.name));
    }
    for (const e of edges) e.path.classList.toggle("hl", e.from === name || e.to === name);
    renderDetails(s);
    history.replaceState(null, "", `#${encodeURIComponent(name)}`);
  }

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    graph.classList.remove("dim");
    stages.forEach(s => s.node.classList.remove("selected", "related"));
    edges.forEach(ed => ed.path.classList.remove("hl"));
    details.replaceChildren(el("p", { class: "empty" }, "Select a stage to see its details."));
    history.replaceState(null, "", location.pathname);
  });

  const fromHash = decodeURIComponent(location.hash.slice(1));
  const active = stages.find(s => s.state === "inprogress" || s.state === "waiting" || s.state === "failed");
  select(byName.has(fromHash) ? fromHash : (active ?? stages[0]).name);
})();
</script>
</body>
</html>
